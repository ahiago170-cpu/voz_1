<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Assistente de Voz Via Connect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .app {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.12);
    }

    h1 {
      font-size: 20px;
      margin: 0 0 5px;
    }

    .sub {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 14px;
      line-height: 1.35;
    }

    .status {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 10px;
      min-height: 18px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      outline: none;
      line-height: 1.35;
    }

    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .botoes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .mic { background: #dc2626; color: white; }
    .send { background: #2563eb; color: white; }
    .stop { background: #0f172a; color: white; margin-top: 10px; width: 100%; }
    .clear { background: #e2e8f0; color: #0f172a; margin-top: 10px; width: 100%; }

    .resposta {
      margin-top: 14px;
      padding: 13px;
      background: #f1f5f9;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      min-height: 78px;
      max-height: 180px;
      overflow-y: auto;
    }

    .ouvindo {
      animation: pulse 1.1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.03); opacity: 0.85; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="app">
    <h1>Assistente Via Connect</h1>
    <div class="sub">Fale ou digite sua pergunta. Depois de enviar, esta janelinha tenta fechar sozinha.</div>

    <div id="status" class="status">Pronto para ouvir.</div>

    <textarea id="textoPergunta" placeholder="Sua fala vai aparecer aqui..."></textarea>

    <div class="botoes">
      <button id="btnFalar" class="mic">🎙️ Iniciar voz</button>
      <button id="btnEnviar" class="send">Enviar</button>
    </div>

    <button id="btnParar" class="stop">Parar voz</button>
    <button id="btnLimpar" class="clear">Limpar texto</button>

    <div id="resposta" class="resposta">Resposta da assistente aparecerá aqui.</div>
  </div>

  <script>
    // IMPORTANTE: cole aqui o link /exec da implantação do Apps Script.
    // Exemplo: https://script.google.com/macros/s/SEU_ID/exec
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxh_TXZAzn5KlGLjLMzCKCeNGHTn_mjjcNAWqRurbUhBhUHIY0VfDd2BAjMRvSw7d0M0g/exec";

    const textoPergunta = document.getElementById("textoPergunta");
    const respostaDiv = document.getElementById("resposta");
    const statusDiv = document.getElementById("status");
    const btnFalar = document.getElementById("btnFalar");
    const btnEnviar = document.getElementById("btnEnviar");
    const btnParar = document.getElementById("btnParar");
    const btnLimpar = document.getElementById("btnLimpar");

    let recognition = null;
    let ouvindo = false;
    let vozSelecionada = null;
    let textoFinal = "";

    function normalizar(texto) {
      return String(texto || "")
        .replace(/\*/g, "")
        .replace(/[#_`]/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function carregarVozFeminina() {
      if (!("speechSynthesis" in window)) return;

      const voices = window.speechSynthesis.getVoices();

      vozSelecionada =
        voices.find(v => v.lang === "pt-BR" && v.name.toLowerCase().includes("maria")) ||
        voices.find(v => v.lang === "pt-BR" && v.name.toLowerCase().includes("francisca")) ||
        voices.find(v => v.lang === "pt-BR" && v.name.toLowerCase().includes("helena")) ||
        voices.find(v => v.lang === "pt-BR" && v.name.toLowerCase().includes("female")) ||
        voices.find(v => v.lang === "pt-BR") ||
        voices.find(v => v.lang.startsWith("pt")) ||
        voices[0];
    }

    function falarTexto(texto) {
      if (!("speechSynthesis" in window)) return;

      window.speechSynthesis.cancel();

      let limpo = normalizar(texto);

      const fala = new SpeechSynthesisUtterance(limpo);
      fala.lang = "pt-BR";
      fala.rate = 0.88;
      fala.pitch = 1.12;
      fala.volume = 0.95;

      if (vozSelecionada) fala.voice = vozSelecionada;

      window.speechSynthesis.speak(fala);
    }

    if ("speechSynthesis" in window) {
      carregarVozFeminina();
      window.speechSynthesis.onvoiceschanged = carregarVozFeminina;
    }

    function iniciarReconhecimento() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        statusDiv.innerText = "Seu navegador não suporta reconhecimento de voz. Use Chrome ou Edge.";
        return;
      }

      window.speechSynthesis?.cancel();
      textoFinal = textoPergunta.value.trim() ? textoPergunta.value.trim() + " " : "";

      recognition = new SpeechRecognition();
      recognition.lang = "pt-BR";
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onstart = function() {
        ouvindo = true;
        btnFalar.classList.add("ouvindo");
        statusDiv.innerText = "Ouvindo... fale agora.";
      };

      recognition.onresult = function(event) {
        let textoTemporario = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const trecho = event.results[i][0].transcript || "";

          if (event.results[i].isFinal) {
            textoFinal += trecho + " ";
          } else {
            textoTemporario += trecho + " ";
          }
        }

        textoPergunta.value = normalizar(textoFinal + textoTemporario);
      };

      recognition.onerror = function(event) {
        statusDiv.innerText = "Erro no microfone: " + event.error;
        btnFalar.classList.remove("ouvindo");
        ouvindo = false;
      };

      recognition.onend = function() {
        btnFalar.classList.remove("ouvindo");
        ouvindo = false;

        if (textoPergunta.value.trim()) {
          statusDiv.innerText = "Fala capturada. Clique em Enviar.";
        } else {
          statusDiv.innerText = "Não consegui transcrever. Tente falar mais perto do microfone.";
        }
      };

      try {
        recognition.start();
      } catch (erro) {
        statusDiv.innerText = "Não consegui iniciar o microfone. Tente novamente.";
      }
    }

    function pararReconhecimento() {
      if (recognition && ouvindo) {
        recognition.stop();
      }
    }

    function chamarIA(pergunta) {
      return new Promise(function(resolve, reject) {
        if (!WEB_APP_URL || WEB_APP_URL.includes("COLE_AQUI")) {
          reject(new Error("Configure o WEB_APP_URL com o link /exec do Apps Script."));
          return;
        }

        const callbackName = "callbackIA_" + Date.now() + "_" + Math.floor(Math.random() * 99999);
        const script = document.createElement("script");

        window[callbackName] = function(data) {
          delete window[callbackName];

          if (script && script.parentNode) {
            script.parentNode.removeChild(script);
          }

          if (data && data.ok) {
            resolve(data.resposta);
          } else {
            reject(new Error(data?.resposta || "Erro desconhecido ao chamar IA."));
          }
        };

        const url =
          WEB_APP_URL +
          "?action=ia" +
          "&callback=" + encodeURIComponent(callbackName) +
          "&pergunta=" + encodeURIComponent(pergunta) +
          "&t=" + Date.now();

        script.src = url;

        script.onerror = function() {
          delete window[callbackName];

          if (script && script.parentNode) {
            script.parentNode.removeChild(script);
          }

          reject(new Error("Falha ao comunicar com o Apps Script. Confira o link /exec e a implantação."));
        };

        document.body.appendChild(script);
      });
    }

    async function enviarPergunta() {
      const pergunta = normalizar(textoPergunta.value);

      if (!pergunta) {
        statusDiv.innerText = "Fale ou digite uma pergunta antes de enviar.";
        return;
      }

      pararReconhecimento();

      btnEnviar.disabled = true;
      btnFalar.disabled = true;
      btnParar.disabled = true;
      btnLimpar.disabled = true;

      statusDiv.innerText = "Enviando para o sistema...";
      respostaDiv.innerText = "Enviando e aguardando resposta...";

      try {
        const resposta = normalizar(await chamarIA(pergunta));

        respostaDiv.innerText = resposta;
        statusDiv.innerText = "Enviado com sucesso. Fechando a janelinha...";

        if (window.opener) {
          window.opener.postMessage({
            tipo: "assistente_voz_enviado",
            pergunta: pergunta,
            resposta: resposta
          }, "*");
        }

        falarTexto(resposta);

        setTimeout(function() {
          window.close();
          statusDiv.innerText = "Pergunta enviada. Pode fechar esta janela.";
        }, 1800);

      } catch (erro) {
        respostaDiv.innerText = "Erro: " + erro.message;
        statusDiv.innerText = "Não consegui enviar para o sistema.";

        btnEnviar.disabled = false;
        btnFalar.disabled = false;
        btnParar.disabled = false;
        btnLimpar.disabled = false;
      }
    }

    btnFalar.addEventListener("click", iniciarReconhecimento);
    btnParar.addEventListener("click", pararReconhecimento);
    btnEnviar.addEventListener("click", enviarPergunta);

    btnLimpar.addEventListener("click", function() {
      textoPergunta.value = "";
      textoFinal = "";
      respostaDiv.innerText = "Resposta da assistente aparecerá aqui.";
      statusDiv.innerText = "Pronto para ouvir.";
    });

    textoPergunta.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && event.ctrlKey) {
        enviarPergunta();
      }
    });
  </script>

</body>
</html>
