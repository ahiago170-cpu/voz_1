<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Assistente de Voz Via Connect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      overflow: hidden;
    }

    .app {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.12);
    }

    h1 {
      font-size: 20px;
      margin: 0 0 5px;
    }

    .sub {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 14px;
      line-height: 1.35;
    }

    .status {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 10px;
      min-height: 18px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: none;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      outline: none;
      line-height: 1.35;
    }

    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .botoes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .mic { background: #dc2626; color: white; }
    .send { background: #2563eb; color: white; }
    .stop { background: #0f172a; color: white; margin-top: 10px; width: 100%; }
    .clear { background: #e2e8f0; color: #0f172a; margin-top: 10px; width: 100%; }

    .resposta {
      margin-top: 14px;
      padding: 13px;
      background: #f1f5f9;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      min-height: 78px;
      max-height: 180px;
      overflow-y: auto;
    }

    .ouvindo { animation: pulse 1.1s infinite; }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.03); opacity: 0.85; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="app">
    <h1>Assistente Via Connect</h1>
    <div class="sub">Pode falar assim que a janela abrir. Ao parar por 2 segundos, envio automaticamente.</div>

    <div id="status" class="status">Iniciando assistente...</div>

    <textarea id="textoPergunta" placeholder="Sua fala vai aparecer aqui..."></textarea>

    <div class="botoes">
      <button id="btnFalar" class="mic">🎙️ Ouvir</button>
      <button id="btnEnviar" class="send">Enviar</button>
    </div>

    <button id="btnParar" class="stop">Parar voz</button>
    <button id="btnLimpar" class="clear">Limpar texto</button>

    <div id="resposta" class="resposta">Aguardando sua fala...</div>
  </div>

  <script>
    // Link /exec da implantação do Apps Script.
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxh_TXZAzn5KlGLjLMzCKCeNGHTn_mjjcNAWqRurbUhBhUHIY0VfDd2BAjMRvSw7d0M0g/exec";

    const TEMPO_SILENCIO_AUTO_ENVIO = 2000; // 2 segundos sem fala: envia sozinho.
    const TEMPO_MAXIMO_SEM_CONVERSA = 60000; // 1 minuto sem conversa: fecha a janela.

    const textoPergunta = document.getElementById("textoPergunta");
    const respostaDiv = document.getElementById("resposta");
    const statusDiv = document.getElementById("status");
    const btnFalar = document.getElementById("btnFalar");
    const btnEnviar = document.getElementById("btnEnviar");
    const btnParar = document.getElementById("btnParar");
    const btnLimpar = document.getElementById("btnLimpar");

    let recognition = null;
    let ouvindo = false;
    let vozSelecionada = null;
    let textoFinal = "";
    let timerSilencio = null;
    let timerSemConversa = null;
    let enviando = false;
    let jaEnviouAutomatico = false;
    let jaTentouAutoStart = false;

    function normalizar(texto) {
      return String(texto || "")
        .replace(/\*/g, "")
        .replace(/[#_`]/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function tocarAtividade() {
      if (timerSemConversa) clearTimeout(timerSemConversa);

      timerSemConversa = setTimeout(function() {
        if (enviando) return;

        try { pararReconhecimento(); } catch (e) {}
        statusDiv.innerText = "Sem conversa por 1 minuto. Fechando a janelinha...";

        setTimeout(function() {
          window.close();
          statusDiv.innerText = "Pode fechar esta janela.";
        }, 600);
      }, TEMPO_MAXIMO_SEM_CONVERSA);
    }

    function carregarVozFeminina() {
      if (!("speechSynthesis" in window)) return;

      const voices = window.speechSynthesis.getVoices();

      vozSelecionada =
        voices.find(v => v.lang === "pt-BR" && v.name.toLowerCase().includes("maria")) ||
        voices.find(v => v.lang === "pt-BR" && v.name.toLowerCase().includes("francisca")) ||
        voices.find(v => v.lang === "pt-BR" && v.name.toLowerCase().includes("helena")) ||
        voices.find(v => v.lang === "pt-BR" && v.name.toLowerCase().includes("female")) ||
        voices.find(v => v.lang === "pt-BR") ||
        voices.find(v => v.lang.startsWith("pt")) ||
        voices[0];
    }

    function falarTexto(texto) {
      if (!("speechSynthesis" in window)) return;

      window.speechSynthesis.cancel();

      let limpo = normalizar(texto);
      if (limpo.length > 600) limpo = limpo.substring(0, 600) + "...";

      const fala = new SpeechSynthesisUtterance(limpo);
      fala.lang = "pt-BR";
      fala.rate = 0.88;
      fala.pitch = 1.12;
      fala.volume = 0.95;

      if (vozSelecionada) fala.voice = vozSelecionada;

      window.speechSynthesis.speak(fala);
    }

    if ("speechSynthesis" in window) {
      carregarVozFeminina();
      window.speechSynthesis.onvoiceschanged = carregarVozFeminina;
    }

    function limparTimerSilencio() {
      if (timerSilencio) {
        clearTimeout(timerSilencio);
        timerSilencio = null;
      }
    }

    function reiniciarTimerSilencio() {
      limparTimerSilencio();

      timerSilencio = setTimeout(function() {
        const pergunta = normalizar(textoPergunta.value);

        if (pergunta && !enviando && !jaEnviouAutomatico) {
          jaEnviouAutomatico = true;
          statusDiv.innerText = "Silêncio detectado. Enviando automaticamente...";
          pararReconhecimento();
          enviarPergunta();
        }
      }, TEMPO_SILENCIO_AUTO_ENVIO);
    }

    function criarReconhecimento() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        statusDiv.innerText = "Seu navegador não suporta reconhecimento de voz. Use Chrome ou Edge.";
        return null;
      }

      const rec = new SpeechRecognition();
      rec.lang = "pt-BR";
      rec.continuous = true;
      rec.interimResults = true;
      rec.maxAlternatives = 1;

      rec.onstart = function() {
        ouvindo = true;
        btnFalar.classList.add("ouvindo");
        statusDiv.innerText = "Ouvindo... fale agora.";
        respostaDiv.innerText = "Escutando sua pergunta...";
        tocarAtividade();
      };

      rec.onresult = function(event) {
        tocarAtividade();

        let textoTemporario = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const trecho = event.results[i][0].transcript || "";

          if (event.results[i].isFinal) {
            textoFinal += trecho + " ";
          } else {
            textoTemporario += trecho + " ";
          }
        }

        const textoAtual = normalizar(textoFinal + textoTemporario);
        textoPergunta.value = textoAtual;

        if (textoAtual) {
          statusDiv.innerText = "Escutando... pare de falar por 2 segundos para enviar.";
          respostaDiv.innerText = "Transcrição: " + textoAtual;
          reiniciarTimerSilencio();
        }
      };

      rec.onerror = function(event) {
        limparTimerSilencio();
        btnFalar.classList.remove("ouvindo");
        ouvindo = false;

        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
          statusDiv.innerText = "Microfone bloqueado. Permita o microfone no cadeado do navegador.";
          respostaDiv.innerText = "Clique em permitir microfone e depois em Ouvir.";
        } else if (event.error === "no-speech") {
          statusDiv.innerText = "Não ouvi fala. Tentando escutar novamente...";
          tentarReiniciarEscuta();
        } else if (event.error === "aborted") {
          // Normal quando a gravação é parada para enviar.
        } else {
          statusDiv.innerText = "Erro no microfone: " + event.error;
        }
      };

      rec.onend = function() {
        btnFalar.classList.remove("ouvindo");
        ouvindo = false;

        const pergunta = normalizar(textoPergunta.value);

        if (!enviando && !jaEnviouAutomatico && pergunta) {
          jaEnviouAutomatico = true;
          statusDiv.innerText = "Fala capturada. Enviando...";
          enviarPergunta();
        } else if (!enviando && !pergunta) {
          statusDiv.innerText = "Aguardando fala...";
        }
      };

      return rec;
    }

    function iniciarReconhecimento() {
      if (enviando || ouvindo) return;

      tocarAtividade();
      window.speechSynthesis?.cancel();
      limparTimerSilencio();

      textoFinal = "";
      jaEnviouAutomatico = false;
      textoPergunta.value = "";

      recognition = criarReconhecimento();
      if (!recognition) return;

      try {
        recognition.start();
      } catch (erro) {
        statusDiv.innerText = "Não consegui iniciar o microfone. Clique em Ouvir.";
      }
    }

    function tentarReiniciarEscuta() {
      if (enviando) return;

      setTimeout(function() {
        if (!ouvindo && !normalizar(textoPergunta.value)) {
          iniciarReconhecimento();
        }
      }, 800);
    }

    function pararReconhecimento() {
      limparTimerSilencio();

      if (recognition && ouvindo) {
        try { recognition.stop(); } catch (e) {}
      }

      ouvindo = false;
      btnFalar.classList.remove("ouvindo");
    }

    function chamarIA(pergunta) {
      return new Promise(function(resolve, reject) {
        if (!WEB_APP_URL || WEB_APP_URL.includes("COLE_AQUI")) {
          reject(new Error("Configure o WEB_APP_URL com o link /exec do Apps Script."));
          return;
        }

        const callbackName = "callbackIA_" + Date.now() + "_" + Math.floor(Math.random() * 99999);
        const script = document.createElement("script");

        window[callbackName] = function(data) {
          delete window[callbackName];
          if (script && script.parentNode) script.parentNode.removeChild(script);

          if (data && data.ok) {
            resolve(data.resposta);
          } else {
            reject(new Error(data?.resposta || "Erro desconhecido ao chamar IA."));
          }
        };

        const url =
          WEB_APP_URL +
          "?action=ia" +
          "&callback=" + encodeURIComponent(callbackName) +
          "&pergunta=" + encodeURIComponent(pergunta) +
          "&t=" + Date.now();

        script.src = url;

        script.onerror = function() {
          delete window[callbackName];
          if (script && script.parentNode) script.parentNode.removeChild(script);
          reject(new Error("Falha ao comunicar com o Apps Script. Confira o link /exec e a implantação."));
        };

        document.body.appendChild(script);
      });
    }

    async function enviarPergunta() {
      const pergunta = normalizar(textoPergunta.value);

      if (!pergunta || enviando) {
        if (!pergunta) statusDiv.innerText = "Não ouvi nenhuma pergunta.";
        return;
      }

      tocarAtividade();
      limparTimerSilencio();
      pararReconhecimento();
      enviando = true;

      btnEnviar.disabled = true;
      btnFalar.disabled = true;
      btnParar.disabled = true;
      btnLimpar.disabled = true;
      textoPergunta.disabled = true;

      statusDiv.innerText = "Enviando para o Via Connect...";
      respostaDiv.innerText = "Enviando...";

      try {
        const resposta = normalizar(await chamarIA(pergunta));

        respostaDiv.innerText = "Enviado com sucesso.";
        statusDiv.innerText = "Enviado. O Via Connect vai falar a resposta.";

        if (window.opener) {
          window.opener.postMessage({
            tipo: "assistente_voz_enviado",
            pergunta: pergunta,
            resposta: resposta
          }, "*");
        }

        // Não fala nesta janelinha. Quem fala a resposta é o Via Connect principal.
        setTimeout(function() {
          window.close();
          statusDiv.innerText = "Pergunta enviada. Pode fechar esta janela.";
        }, 500);

      } catch (erro) {
        enviando = false;
        jaEnviouAutomatico = false;

        respostaDiv.innerText = "Erro: " + erro.message;
        statusDiv.innerText = "Não consegui enviar para o sistema.";

        btnEnviar.disabled = false;
        btnFalar.disabled = false;
        btnParar.disabled = false;
        btnLimpar.disabled = false;
        textoPergunta.disabled = false;
        tocarAtividade();
      }
    }

    btnFalar.addEventListener("click", iniciarReconhecimento);
    btnParar.addEventListener("click", function() {
      pararReconhecimento();
      const pergunta = normalizar(textoPergunta.value);
      statusDiv.innerText = pergunta ? "Fala capturada. Enviando..." : "Voz parada.";
      if (pergunta) enviarPergunta();
    });
    btnEnviar.addEventListener("click", enviarPergunta);

    btnLimpar.addEventListener("click", function() {
      tocarAtividade();
      limparTimerSilencio();
      textoPergunta.value = "";
      textoFinal = "";
      jaEnviouAutomatico = false;
      respostaDiv.innerText = "Aguardando sua fala...";
      statusDiv.innerText = "Abrindo microfone automaticamente...";
    });

    textoPergunta.addEventListener("input", function() {
      tocarAtividade();
      if (normalizar(textoPergunta.value)) reiniciarTimerSilencio();
    });

    textoPergunta.addEventListener("keydown", function(event) {
      tocarAtividade();
      if (event.key === "Enter" && event.ctrlKey) enviarPergunta();
    });

    window.addEventListener("load", function() {
      tocarAtividade();

      // Se a página foi aberta pelo botão do Via Connect, o navegador costuma permitir iniciar a escuta.
      setTimeout(function() {
        if (!jaTentouAutoStart) {
          jaTentouAutoStart = true;
          iniciarReconhecimento();
        }
      }, 650);
    });

    window.addEventListener("beforeunload", function() {
      limparTimerSilencio();
      if (timerSemConversa) clearTimeout(timerSemConversa);
      try { pararReconhecimento(); } catch (e) {}
      window.speechSynthesis?.cancel();
    });
  </script>

</body>
</html>
