<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Assistente de Voz Via Connect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.12);
    }

    h1 {
      font-size: 22px;
      margin: 0 0 6px;
    }

    .sub {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .status {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 12px;
      min-height: 18px;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      outline: none;
    }

    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .botoes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .mic {
      background: #dc2626;
      color: white;
    }

    .send {
      background: #2563eb;
      color: white;
    }

    .stop {
      background: #0f172a;
      color: white;
      margin-top: 10px;
      width: 100%;
    }

    .resposta {
      margin-top: 18px;
      padding: 14px;
      background: #f1f5f9;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.45;
      white-space: pre-wrap;
      min-height: 80px;
    }

    .ouvindo {
      animation: pulse 1.1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.03); opacity: 0.85; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="app">
    <h1>Assistente Via Connect</h1>
    <div class="sub">Fale sua pergunta e envie para o painel.</div>

    <div id="status" class="status">Pronto para ouvir.</div>

    <textarea id="textoPergunta" placeholder="Sua fala vai aparecer aqui..."></textarea>

    <div class="botoes">
      <button id="btnFalar" class="mic">🎙️ Iniciar voz</button>
      <button id="btnEnviar" class="send">Enviar</button>
    </div>

    <button id="btnParar" class="stop">Parar voz</button>

    <div id="resposta" class="resposta">Resposta da assistente aparecerá aqui.</div>
  </div>

  <script>
    // COLE AQUI O LINK /exec DO SEU APPS SCRIPT
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx4p6PVeV9BbvYicaqlUF4Z1flfPrrrwBaQHjcR2z14e-bTbH8NXqy1Flj7lXBrrcyFPg/exec";

    const textoPergunta = document.getElementById("textoPergunta");
    const respostaDiv = document.getElementById("resposta");
    const statusDiv = document.getElementById("status");
    const btnFalar = document.getElementById("btnFalar");
    const btnEnviar = document.getElementById("btnEnviar");
    const btnParar = document.getElementById("btnParar");

    let recognition = null;
    let ouvindo = false;
    let vozSelecionada = null;

    function carregarVozFeminina() {
      if (!("speechSynthesis" in window)) return;

      const voices = window.speechSynthesis.getVoices();

      vozSelecionada =
        voices.find(v => v.lang === "pt-BR" && v.name.toLowerCase().includes("maria")) ||
        voices.find(v => v.lang === "pt-BR" && v.name.toLowerCase().includes("francisca")) ||
        voices.find(v => v.lang === "pt-BR" && v.name.toLowerCase().includes("helena")) ||
        voices.find(v => v.lang === "pt-BR") ||
        voices.find(v => v.lang.startsWith("pt")) ||
        voices[0];

      console.log("Voz escolhida:", vozSelecionada ? vozSelecionada.name : "nenhuma");
    }

    function falarTexto(texto) {
      if (!("speechSynthesis" in window)) return;

      window.speechSynthesis.cancel();

      let limpo = texto
        .replace(/\*/g, "")
        .replace(/[#_`]/g, "")
        .replace(/\s+/g, " ")
        .trim();

      const fala = new SpeechSynthesisUtterance(limpo);
      fala.lang = "pt-BR";
      fala.rate = 0.88;
      fala.pitch = 1.12;
      fala.volume = 0.95;

      if (vozSelecionada) {
        fala.voice = vozSelecionada;
      }

      window.speechSynthesis.speak(fala);
    }

    if ("speechSynthesis" in window) {
      carregarVozFeminina();
      window.speechSynthesis.onvoiceschanged = carregarVozFeminina;
    }

    function iniciarReconhecimento() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        statusDiv.innerText = "Seu navegador não suporta reconhecimento de voz. Use Chrome ou Edge.";
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = "pt-BR";
      recognition.continuous = true;
      recognition.interimResults = true;

      let textoFinal = "";

      recognition.onstart = function() {
        ouvindo = true;
        btnFalar.classList.add("ouvindo");
        statusDiv.innerText = "Ouvindo... fale agora.";
      };

      recognition.onresult = function(event) {
        let textoTemporario = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const trecho = event.results[i][0].transcript;

          if (event.results[i].isFinal) {
            textoFinal += trecho + " ";
          } else {
            textoTemporario += trecho;
          }
        }

        textoPergunta.value = (textoFinal + textoTemporario).trim();
      };

      recognition.onerror = function(event) {
        statusDiv.innerText = "Erro no microfone: " + event.error;
        btnFalar.classList.remove("ouvindo");
        ouvindo = false;
      };

      recognition.onend = function() {
        btnFalar.classList.remove("ouvindo");
        ouvindo = false;

        if (textoPergunta.value.trim()) {
          statusDiv.innerText = "Fala capturada. Clique em Enviar.";
        } else {
          statusDiv.innerText = "Não consegui transcrever. Tente falar mais perto do microfone.";
        }
      };

      recognition.start();
    }

    function pararReconhecimento() {
      if (recognition && ouvindo) {
        recognition.stop();
      }
    }

    function chamarIA(pergunta) {
      return new Promise(function(resolve, reject) {
        const callbackName = "callbackIA_" + Date.now();

        window[callbackName] = function(data) {
          delete window[callbackName];
          script.remove();

          if (data && data.ok) {
            resolve(data.resposta);
          } else {
            reject(new Error(data?.resposta || "Erro desconhecido."));
          }
        };

        const script = document.createElement("script");

        const url =
          WEB_APP_URL +
          "?action=ia" +
          "&callback=" + encodeURIComponent(callbackName) +
          "&pergunta=" + encodeURIComponent(pergunta);

        script.src = url;

        script.onerror = function() {
          delete window[callbackName];
          script.remove();
          reject(new Error("Falha ao comunicar com o Apps Script."));
        };

        document.body.appendChild(script);
      });
    }

    async function enviarPergunta() {
      const pergunta = textoPergunta.value.trim();

      if (!pergunta) {
        statusDiv.innerText = "Fale ou digite uma pergunta antes de enviar.";
        return;
      }

      statusDiv.innerText = "Enviando para a IA...";
      respostaDiv.innerText = "Pensando...";

      try {
        const resposta = await chamarIA(pergunta);

        respostaDiv.innerText = resposta;
        statusDiv.innerText = "Resposta recebida.";
        falarTexto(resposta);

      } catch (erro) {
        respostaDiv.innerText = "Erro: " + erro.message;
        statusDiv.innerText = "Não consegui comunicar com a IA.";
      }
    }

    btnFalar.addEventListener("click", function() {
      window.speechSynthesis.cancel();
      iniciarReconhecimento();
    });

    btnParar.addEventListener("click", pararReconhecimento);

    btnEnviar.addEventListener("click", enviarPergunta);
  </script>

</body>
</html>
