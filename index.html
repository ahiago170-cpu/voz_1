<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Assistente de Voz Via Connect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      overflow: hidden;
    }

    .app {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.12);
    }

    h1 {
      font-size: 20px;
      margin: 0 0 5px;
    }

    .sub {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 14px;
      line-height: 1.35;
    }

    .status {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 10px;
      min-height: 18px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: none;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      outline: none;
      line-height: 1.35;
    }

    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .botoes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .mic { background: #dc2626; color: white; }
    .send { background: #2563eb; color: white; }
    .stop { background: #0f172a; color: white; margin-top: 10px; width: 100%; }
    .clear { background: #e2e8f0; color: #0f172a; margin-top: 10px; width: 100%; }

    .resposta {
      margin-top: 14px;
      padding: 13px;
      background: #f1f5f9;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      min-height: 78px;
      max-height: 180px;
      overflow-y: auto;
    }

    .ouvindo { animation: pulse 1.1s infinite; }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.03); opacity: 0.85; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="app">
    <h1>Assistente Via Connect</h1>
    <div class="sub">Pode falar assim que a janela abrir. Ao parar por 2 segundos, eu envio o texto para o Via Connect.</div>

    <div id="status" class="status">Iniciando assistente...</div>

    <textarea id="textoPergunta" placeholder="Sua fala vai aparecer aqui..."></textarea>

    <div class="botoes">
      <button id="btnFalar" class="mic">🎙️ Ouvir</button>
      <button id="btnEnviar" class="send">Enviar texto</button>
    </div>

    <button id="btnParar" class="stop">Parar voz e enviar</button>
    <button id="btnLimpar" class="clear">Limpar texto</button>

    <div id="resposta" class="resposta">Aguardando sua fala...</div>
  </div>

  <script>
    // Esta página NÃO chama IA, NÃO fala resposta e NÃO acessa planilha.
    // Ela apenas converte voz em texto e envia a pergunta para a janela principal do Via Connect.

    const TEMPO_SILENCIO_AUTO_ENVIO = 2000; // 2 segundos sem fala: envia sozinho.
    const TEMPO_MAXIMO_SEM_CONVERSA = 60000; // 1 minuto sem conversa: fecha a janela.

    const textoPergunta = document.getElementById("textoPergunta");
    const respostaDiv = document.getElementById("resposta");
    const statusDiv = document.getElementById("status");
    const btnFalar = document.getElementById("btnFalar");
    const btnEnviar = document.getElementById("btnEnviar");
    const btnParar = document.getElementById("btnParar");
    const btnLimpar = document.getElementById("btnLimpar");

    let recognition = null;
    let ouvindo = false;
    let textoFinal = "";
    let timerSilencio = null;
    let timerSemConversa = null;
    let enviando = false;
    let jaEnviouAutomatico = false;
    let jaTentouAutoStart = false;

    function normalizar(texto) {
      return String(texto || "")
        .replace(/\*/g, "")
        .replace(/[#_`]/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function tocarAtividade() {
      if (timerSemConversa) clearTimeout(timerSemConversa);

      timerSemConversa = setTimeout(function() {
        if (enviando) return;

        try { pararReconhecimento(); } catch (e) {}
        statusDiv.innerText = "Sem conversa por 1 minuto. Fechando a janelinha...";

        setTimeout(function() {
          window.close();
          statusDiv.innerText = "Pode fechar esta janela.";
        }, 600);
      }, TEMPO_MAXIMO_SEM_CONVERSA);
    }

    function limparTimerSilencio() {
      if (timerSilencio) {
        clearTimeout(timerSilencio);
        timerSilencio = null;
      }
    }

    function reiniciarTimerSilencio() {
      limparTimerSilencio();

      timerSilencio = setTimeout(function() {
        const pergunta = normalizar(textoPergunta.value);

        if (pergunta && !enviando && !jaEnviouAutomatico) {
          jaEnviouAutomatico = true;
          statusDiv.innerText = "Silêncio detectado. Enviando para o Via Connect...";
          pararReconhecimento();
          enviarPerguntaParaViaConnect();
        }
      }, TEMPO_SILENCIO_AUTO_ENVIO);
    }

    function criarReconhecimento() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        statusDiv.innerText = "Seu navegador não suporta reconhecimento de voz. Use Chrome ou Edge.";
        return null;
      }

      const rec = new SpeechRecognition();
      rec.lang = "pt-BR";
      rec.continuous = true;
      rec.interimResults = true;
      rec.maxAlternatives = 1;

      rec.onstart = function() {
        ouvindo = true;
        btnFalar.classList.add("ouvindo");
        statusDiv.innerText = "Ouvindo... fale agora.";
        respostaDiv.innerText = "Escutando sua pergunta...";
        tocarAtividade();
      };

      rec.onresult = function(event) {
        tocarAtividade();

        let textoTemporario = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const trecho = event.results[i][0].transcript || "";

          if (event.results[i].isFinal) {
            textoFinal += trecho + " ";
          } else {
            textoTemporario += trecho + " ";
          }
        }

        const textoAtual = normalizar(textoFinal + textoTemporario);
        textoPergunta.value = textoAtual;

        if (textoAtual) {
          statusDiv.innerText = "Escutando... pare de falar por 2 segundos para enviar.";
          respostaDiv.innerText = "Texto capturado: " + textoAtual;
          reiniciarTimerSilencio();
        }
      };

      rec.onerror = function(event) {
        limparTimerSilencio();
        btnFalar.classList.remove("ouvindo");
        ouvindo = false;

        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
          statusDiv.innerText = "Microfone bloqueado. Permita o microfone no cadeado do navegador.";
          respostaDiv.innerText = "Clique em permitir microfone e depois em Ouvir.";
        } else if (event.error === "no-speech") {
          statusDiv.innerText = "Não ouvi fala. Tentando escutar novamente...";
          tentarReiniciarEscuta();
        } else if (event.error === "aborted") {
          // Normal quando a gravação é parada para enviar.
        } else {
          statusDiv.innerText = "Erro no microfone: " + event.error;
        }
      };

      rec.onend = function() {
        btnFalar.classList.remove("ouvindo");
        ouvindo = false;

        const pergunta = normalizar(textoPergunta.value);

        if (!enviando && !jaEnviouAutomatico && pergunta) {
          jaEnviouAutomatico = true;
          statusDiv.innerText = "Fala capturada. Enviando para o Via Connect...";
          enviarPerguntaParaViaConnect();
        } else if (!enviando && !pergunta) {
          statusDiv.innerText = "Aguardando fala...";
        }
      };

      return rec;
    }

    function iniciarReconhecimento() {
      if (enviando || ouvindo) return;

      tocarAtividade();
      limparTimerSilencio();

      textoFinal = "";
      jaEnviouAutomatico = false;
      textoPergunta.value = "";

      recognition = criarReconhecimento();
      if (!recognition) return;

      try {
        recognition.start();
      } catch (erro) {
        statusDiv.innerText = "Não consegui iniciar o microfone. Clique em Ouvir.";
      }
    }

    function tentarReiniciarEscuta() {
      if (enviando) return;

      setTimeout(function() {
        if (!ouvindo && !normalizar(textoPergunta.value)) {
          iniciarReconhecimento();
        }
      }, 800);
    }

    function pararReconhecimento() {
      limparTimerSilencio();

      if (recognition && ouvindo) {
        try { recognition.stop(); } catch (e) {}
      }

      ouvindo = false;
      btnFalar.classList.remove("ouvindo");
    }

    function avisarViaConnect(pergunta) {
      const mensagem = {
        tipo: "assistente_voz_pergunta",
        id: "voz_pergunta_" + Date.now() + "_" + Math.floor(Math.random() * 999999),
        pergunta: pergunta
      };

      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(mensagem, "*");

          // Reenvios rápidos para garantir que o Via Connect receba antes da janela fechar.
          setTimeout(function() {
            try { window.opener.postMessage(mensagem, "*"); } catch (e) {}
          }, 200);

          setTimeout(function() {
            try { window.opener.postMessage(mensagem, "*"); } catch (e) {}
          }, 450);

          return true;
        }
      } catch (e) {}

      return false;
    }

    async function enviarPerguntaParaViaConnect() {
      const pergunta = normalizar(textoPergunta.value);

      if (!pergunta || enviando) {
        if (!pergunta) statusDiv.innerText = "Não ouvi nenhuma pergunta.";
        return;
      }

      tocarAtividade();
      limparTimerSilencio();
      pararReconhecimento();
      enviando = true;

      btnEnviar.disabled = true;
      btnFalar.disabled = true;
      btnParar.disabled = true;
      btnLimpar.disabled = true;
      textoPergunta.disabled = true;

      statusDiv.innerText = "Enviando texto para o Via Connect...";
      respostaDiv.innerText = pergunta;

      const enviado = avisarViaConnect(pergunta);

      if (enviado) {
        statusDiv.innerText = "Texto enviado. O Via Connect vai consultar a IA e falar a resposta.";

        setTimeout(function() {
          window.close();
          statusDiv.innerText = "Texto enviado. Pode fechar esta janela.";
        }, 900);
      } else {
        enviando = false;
        jaEnviouAutomatico = false;

        statusDiv.innerText = "Não encontrei a janela principal do Via Connect.";
        respostaDiv.innerText = "Abra esta página pelo botão 🎙️ do Via Connect para enviar automaticamente.";

        btnEnviar.disabled = false;
        btnFalar.disabled = false;
        btnParar.disabled = false;
        btnLimpar.disabled = false;
        textoPergunta.disabled = false;
      }
    }

    btnFalar.addEventListener("click", iniciarReconhecimento);

    btnParar.addEventListener("click", function() {
      pararReconhecimento();
      const pergunta = normalizar(textoPergunta.value);
      statusDiv.innerText = pergunta ? "Fala capturada. Enviando para o Via Connect..." : "Voz parada.";
      if (pergunta) enviarPerguntaParaViaConnect();
    });

    btnEnviar.addEventListener("click", enviarPerguntaParaViaConnect);

    btnLimpar.addEventListener("click", function() {
      tocarAtividade();
      limparTimerSilencio();
      textoPergunta.value = "";
      textoFinal = "";
      jaEnviouAutomatico = false;
      respostaDiv.innerText = "Aguardando sua fala...";
      statusDiv.innerText = "Abrindo microfone automaticamente...";
    });

    textoPergunta.addEventListener("input", function() {
      tocarAtividade();
      if (normalizar(textoPergunta.value)) reiniciarTimerSilencio();
    });

    textoPergunta.addEventListener("keydown", function(event) {
      tocarAtividade();
      if (event.key === "Enter" && event.ctrlKey) enviarPerguntaParaViaConnect();
    });

    window.addEventListener("load", function() {
      tocarAtividade();

      // Quando aberta pelo botão do Via Connect, tenta começar a escutar automaticamente.
      setTimeout(function() {
        if (!jaTentouAutoStart) {
          jaTentouAutoStart = true;
          iniciarReconhecimento();
        }
      }, 650);
    });

    window.addEventListener("beforeunload", function() {
      limparTimerSilencio();
      if (timerSemConversa) clearTimeout(timerSemConversa);
      try { pararReconhecimento(); } catch (e) {}
    });
  </script>

</body>
</html>
